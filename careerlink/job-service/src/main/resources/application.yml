server:
  port: ${JOB_SERVICE_PORT:8083}
spring:
  application:
    name: job-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    mongodb:
      uri: ${JOB_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/careerlink_job}}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
