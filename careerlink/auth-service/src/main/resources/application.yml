server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${AUTH_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/careerlink_auth}}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

security:
  jwt:
    secret: ${JWT_SECRET:01234567890123456789012345678901}
    expiration-ms: ${JWT_EXPIRATION:86400000}

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
